
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập Pet Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar bg-black">
    <div class="container">
        <a  class="navbar-brand">Pet Shop </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card p-4 mx-auto col-md-6">
        <h2 class="text-center">Đăng nhập tài khoản</h2>
        <p class="text-center">Chào mừng bạn đến với Pet Shop!</p>

        <form>
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" class="form-control"
                       placeholder="Nhập tên đăng nhập">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control"
                       placeholder="Nhập email">
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" class="form-control"
                       placeholder="Nhập mật khẩu">
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">Ghi nhớ đăng nhập</label>
            </div>

            <button type="submit" class="btn btn-warning w-100">
                Đăng nhập
            </button>
        </form>

        <p class="text-center mt-3">
        Chưa có tài khoản?
            <a href="dangki.html">Đăng ký ngay</a>
        </p>

        <p class="text-center">
            <a href="index.html">Quay lại trang chủ</a>
        </p>
    </div>
</div>

</body>
</html>
